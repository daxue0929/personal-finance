services:
  web:
    image: fund-crawler:latest
    container_name: fund-crawler-web
    command: ["python", "-m", "app.web", "--port", "5000"]
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-personal-finance}
      - SCHEDULER_INTERNAL_URL=http://scheduler:5001
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_COOKIE_SECURE=${FLASK_COOKIE_SECURE:-false}
      # OCR 识别接口（/api/ocr/recognize）Basic Auth 凭证，服务器 .env 配置
      - OCR_API_CLIENT_ID=${OCR_API_CLIENT_ID}
      - OCR_API_CLIENT_SECRET=${OCR_API_CLIENT_SECRET}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # PaddleOCR 模型缓存（首次识别下载数百 MB 到 /root/.paddlex），
      # 命名卷持久化：deploy.sh 每次 force-recreate web 容器后不丢失，避免每次部署重新下载
      - paddle-models:/root/.paddlex
    depends_on:
      - scheduler
    restart: unless-stopped
    networks:
      - fund-network

  scheduler:
    image: fund-crawler:latest
    container_name: fund-crawler-scheduler
    command: ["python", "-m", "app.scheduler", "--port", "5001"]
    expose:
      - "5001"
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-personal-finance}
      - PLAYWRIGHT_CDP_URL=http://browser:9222
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fund-network

  browser:
    # 自定义镜像：基于微软官方 playwright 镜像 + node HTTP 反向代理（见 Dockerfile.browser / browser-entrypoint.sh）。
    # chrome headless 只绑 127.0.0.1 且对 /json/version 有 Host 头检查，node 代理转发 0.0.0.0:9222 -> 127.0.0.1:9223
    # 并改写 Host 头与 webSocketDebuggerUrl，使容器外可访问 CDP。
    image: fund-browser:latest
    container_name: fund-crawler-browser
    # ports：本地开发时 scheduler 在宿主机跑，经此映射用 http://127.0.0.1:9222 连接；
    # 生产时 scheduler 在另一容器，经 fund-network 用 http://browser:9222 连接。
    ports:
      - "9222:9222"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:9222/json/version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - fund-network

networks:
  fund-network:
    driver: bridge

volumes:
  # PaddleOCR 模型缓存（web 容器 /root/.paddlex），跨部署持久化
  paddle-models:
